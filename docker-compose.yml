services:
  # PostgreSQL 9.5.21 database service for Rails 5.0.7.2
  database:
    image: postgres:9.5.21
    container_name: consul_postgres
    environment:
      POSTGRES_DB: consul_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - consul_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis service for caching and background jobs
  redis:
    image: redis:6.2-alpine
    container_name: consul_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - consul_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Rails application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    dns:
      - 8.8.8.8
      - 1.1.1.1
    container_name: consul_app
    command: /var/www/consul/scripts/start-app.sh
    working_dir: /var/www/consul
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@database:5432/consul_development
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consul_development
      BUNDLE_PATH: /usr/local/bundle
      # SSH_AUTH_SOCK: /tmp/agent.sock
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/var/www/consul:delegated
      - bundle_cache:/usr/local/bundle:delegated
      - node_modules:/var/www/consul/node_modules
      # - "$SSH_AUTH_SOCK:/tmp/agent.sock"
    networks:
      - consul_network
    stdin_open: true
    tty: true

  # Background job worker (for delayed_job)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consul_worker
    command: bundle exec rake jobs:work
    working_dir: /var/www/consul
    environment:
      RAILS_ENV: development
      # DATABASE_URL: postgres://postgres:postgres@database:5432/consul_development
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consul_development
      BUNDLE_PATH: /usr/local/bundle
      # Skip database setup for worker
      SKIP_DATABASE_SETUP: "true"
    depends_on:
      app:
        condition: service_started
    volumes:
      - .:/var/www/consul:delegated
      - bundle_cache:/usr/local/bundle:delegated
    networks:
      - consul_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bundle_cache:
    driver: local
  node_modules:
    driver: local

networks:
  consul_network:
    driver: bridge
