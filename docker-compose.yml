services:
  # PostgreSQL 9.5.21 database service - COMMENTED OUT FOR EXTERNAL DB
  # database:
  #   image: postgres:9.5.21
  #   container_name: consul_postgres
  #   environment:
  #     POSTGRES_DB: consul_development
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_HOST_AUTH_METHOD: trust
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - consul_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis service for caching and background jobs
  redis:
    image: redis:6.2-alpine
    container_name: consul_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - consul_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Rails application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consul_app
    command: /var/www/consul/scripts/start-app.sh
    working_dir: /var/www/consul
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      BUNDLE_PATH: ${BUNDLE_PATH}
      SSH_AUTH_SOCK: /tmp/agent.sock
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/var/www/consul:delegated
      - bundle_cache:/usr/local/bundle:delegated
      - node_modules:/var/www/consul/node_modules
      - "$SSH_AUTH_SOCK:/tmp/agent.sock"
    networks:
      - consul_network
    stdin_open: true
    tty: true

  # Background job worker (for delayed_job)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consul_worker
    command: bundle exec rake jobs:work
    working_dir: /var/www/consul
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      BUNDLE_PATH: ${BUNDLE_PATH}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/consul:delegated
      - bundle_cache:/usr/local/bundle:delegated
    networks:
      - consul_network

volumes:
  # postgres_data:  # Commented out - no longer needed for external DB
  #   driver: local
  redis_data:
    driver: local
  bundle_cache:
    driver: local
  node_modules:
    driver: local

networks:
  consul_network:
    driver: bridge
